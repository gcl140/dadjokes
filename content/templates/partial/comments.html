<!-- Mobile: Instagram-style sheet sliding up from the bottom, leaving the
     joke visible above it. Desktop (sm+): a centered modal. -->
<div id="comments-modal"
     class="fixed inset-0 bg-black/50 hidden justify-center items-end sm:items-center z-[9999] sm:p-4">

    <div id="comments-sheet"
         class="bg-canvas-raised border border-hairline shadow-2xl w-full flex flex-col
                h-[70vh] rounded-t-3xl translate-y-full
                sm:h-auto sm:max-h-[85vh] sm:max-w-lg sm:rounded-2xl sm:translate-y-0
                transition-transform duration-300 ease-out">
        <!-- Drag handle (mobile only) -->
        <div class="sm:hidden flex justify-center pt-3 pb-1 flex-shrink-0">
            <div class="w-10 h-1 rounded-full bg-hairline-strong"></div>
        </div>

        <!-- Header -->
        <div class="flex justify-between items-center px-6 py-4 sm:py-6 border-b border-hairline flex-shrink-0">
            <h2 class="text-xl font-bold text-ink">Comments</h2>
            <button id="close-comments-full" class="text-ink-faint hover:text-ink transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>

        <!-- Comments List -->
        <div id="comments-list" class="flex-1 overflow-y-auto thin-scrollbar p-6 space-y-1.5">
            <!-- JS will inject comments here -->
        </div>

        <!-- Pagination (JS-populated, only shown when there's more than one page) -->
        <div id="comments-pagination" class="flex-shrink-0"></div>

        <!-- Footer with input and send button -->
        <div class="p-4 sm:p-6 pb-safe border-t border-hairline flex gap-2 flex-shrink-0">
            <input id="comment-input" type="text" placeholder="Write a comment..."
                class="flex-1 border border-hairline rounded-xl py-2 px-4 focus:outline-none focus:ring-2 focus:ring-accent-400 bg-surface-2 text-ink placeholder-ink-faint">
            <button id="send-comment" {% if not user.is_authenticated %}onclick=window.location.href='{% url "login" %}'{% endif %}
                    class="bg-accent-400 hover:bg-accent-500 text-accent-ink py-2 px-5 rounded-xl font-medium transition-colors duration-200 tap-scale flex-shrink-0">
                Send
            </button>
        </div>
    </div>
</div>
