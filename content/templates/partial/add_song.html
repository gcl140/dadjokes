<div id="songs-modal"
     class="fixed inset-0 bg-black/60 hidden z-[9999] p-4
            flex justify-center items-center">

    <div class="bg-canvas-raised border border-hairline rounded-2xl shadow-2xl w-full max-w-lg max-h-[90vh] flex flex-col">
        <!-- Header -->
        <div class="flex justify-between items-center p-6 border-b border-hairline">
            <h2 class="text-xl font-bold text-ink">Search Song</h2>
            <button id="song-comments-full" class="text-ink-faint hover:text-ink transition-colors" onclick="document.getElementById('songs-modal').classList.add('hidden')">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>

        <!-- Results List -->
        <div id="songs-list" class="flex-1 overflow-y-auto thin-scrollbar p-6 space-y-4 max-h-[400px] text-ink-muted text-sm">
            Type in a song name and click "Search" to find background music for your joke.
            Make sure to add the song title and artist for better results! example: "Blinding Lights The Weeknd"
        </div>

        <!-- Footer with input and send button -->
<form id="add-song-form" method="POST" action="{% url 'add_song' %}"
      class="p-6 border-t border-hairline flex md:flex-row flex-col gap-2">
    {% csrf_token %}

    <input
        id="songs-input"
        name="query"
        type="text"
        placeholder="Search for a song…"
        class="flex-1 border border-hairline rounded-xl py-2 px-4
               focus:outline-none focus:ring-2 focus:ring-accent-400
               bg-surface-2 text-ink placeholder-ink-faint"
        required
    >

    {% if not user.is_authenticated %}
        <button
            type="button"
            onclick="window.location.href='{% url 'login' %}'"
            class="bg-accent-400 hover:bg-accent-500 text-accent-ink py-2 px-5 rounded-xl font-medium transition-colors duration-200 tap-scale">
            Login
        </button>
    {% else %}
        <button
            type="submit"
            class="bg-accent-400 hover:bg-accent-500 text-accent-ink py-2 px-5 rounded-xl font-medium transition-colors duration-200 tap-scale">
            Search
        </button>
    {% endif %}
</form>

    </div>
</div>
