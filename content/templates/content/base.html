{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}No, Jay!{% endblock %}</title>
    <!-- Set the theme before first paint to avoid a light/dark flash -->
    <script>
        (function () {
            try {
                var t = localStorage.getItem('yd-theme');
                if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                if (t === 'dark') document.documentElement.classList.add('dark');
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
    <link rel="icon" type="image/x-icon" href="{% static 'images/fav.png' %}">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="{% static 'js/theme.js' %}" defer></script>
    <script src="{% static 'js/bg-jobs.js' %}" defer></script>
    <script src="{% static 'js/notifications.js' %}" defer></script>
    <script src="{% static 'js/search.js' %}" defer></script>

</head>
<body class="bg-canvas text-ink" data-user-name="{% if user.is_authenticated %}{{ user.username }}{% else %}None{% endif %}">
    <div class="relative min-h-screen">
        <!-- Main scroll container -->

            <!-- Floating Search Bar with Suggestions -->
            <div class="fixed top-4 left-1/2 transform -translate-x-1/2 w-11/12 md:w-1/2 z-50 pt-safe">
            <!-- Search Input -->

            <div class="glass-pill rounded-full shadow-lg flex items-center pl-2 pr-2 py-2 gap-1 transition-shadow focus-within:ring-2 focus-within:ring-accent-400">
                  <button onclick="window.location.href='{% url 'index' %}'" aria-label="Home" class="tap-scale w-9 h-9 flex items-center justify-center rounded-full text-ink-muted hover:text-ink hover:bg-surface-2 transition-colors flex-shrink-0">
                    <i class="fas fa-house text-sm"></i>
                </button>
                <span class="w-px h-5 bg-hairline flex-shrink-0"></span>

                <input
                id="floatingSearch"
                type="text"
                placeholder="Search jokes..."
                class="flex-1 min-w-0 bg-transparent focus:outline-none ml-2 text-sm text-ink placeholder-ink-faint"
                autocomplete="off"
                />
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-ink-faint flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35m0 0A7.5 7.5 0 1010.5 3a7.5 7.5 0 006.15 13.65z" />
                </svg>
                <!-- Slow-job indicator (e.g. song search running in the
                     background) - hidden until a job is in flight, see
                     static/js/bg-jobs.js. Persists across page loads via
                     localStorage and clears itself once the completion
                     notification arrives. -->
                <div id="bg-job-indicator" class="hidden items-center justify-center w-9 h-9 rounded-full flex-shrink-0 text-accent-500" title="Working in the background…">
                    <svg class="animate-spin h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                    </svg>
                </div>
                <span class="w-px h-5 bg-hairline flex-shrink-0"></span>
                <button data-theme-toggle aria-label="Toggle dark mode" class="tap-scale w-9 h-9 flex items-center justify-center rounded-full text-ink-muted hover:text-ink hover:bg-surface-2 transition-colors flex-shrink-0">
                    <i class="fas fa-sun text-sm hidden! dark:inline!"></i>
                    <i class="fas fa-moon text-sm inline! dark:hidden!"></i>
                </button>
            </div>

            <!-- Suggestions Box -->
            <div id="searchSuggestions" class="mt-2 bg-canvas-raised border border-hairline rounded-2xl shadow-lg hidden max-h-64 overflow-y-auto thin-scrollbar">
                <!-- Suggestions will be injected here dynamically -->
            </div>
            </div>
        {% block content %}

        {% endblock %}

        <!-- Bottom navigation -->
        <div class="fixed bottom-0 left-0 right-0 flex justify-center pb-safe pt-10 bg-[linear-gradient(to_top,var(--tw-scrim),transparent)] z-30 pointer-events-none">
        <div class="glass-panel pointer-events-auto rounded-full flex items-center gap-6 sm:gap-10 px-8 py-3 shadow-2xl">

        <button
            class="relative text-ink-faint hover:text-ink flex flex-col items-center tap-scale transition-colors"
            onclick="window.location.href='{% url 'inbox' %}'"
        >
            <!-- ICON -->
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none"
                viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002
                    0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0
                    .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
            </svg>

            <!-- LABEL -->
            <span class="text-[11px] mt-1 font-medium">Inbox</span>

            <!-- BADGE - always in the DOM so the notifications websocket can
                 reveal/update it live; server-rendered state covers first load -->
            <span
            id="notification-badge"
                class="absolute -top-1.5 -right-2 bg-accent-400 text-accent-ink rounded-full
                    w-4 h-4 flex items-center justify-center text-[10px] font-bold shadow-lg
                    {% if not notificates %}hidden{% endif %}"
            >{{ notificates|default:0 }}</span>
        </button>


            <!-- Trigger button -->
            <button  onclick="window.location.href='{% url 'create_joke' %}'" aria-label="Create a joke" class="text-white flex flex-col items-center tap-scale">
            <div class="bg-accent-400 rounded-full p-3 -mt-6 shadow-lg shadow-accent-400/30 ring-4 ring-canvas">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-accent-ink" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4" />
                </svg>
            </div>
            </button>



            <button class="text-ink-faint hover:text-ink flex flex-col items-center tap-scale transition-colors" onclick="window.location.href='{% if user.is_authenticated %}{% url 'profile' user.id %}{% else %}{% url 'login' %}{% endif %}'">
                {% if user.is_authenticated %}
                    <img
                        src="{% if user.profile_picture %}{{ user.profile_picture.url }}{% else %}{% static 'images/default-profile.jpg' %}{% endif %}"
                        alt="{{ user.username }}'s avatar"
                        onerror="this.onerror=null; this.src='{% static 'images/default-profile.jpg' %}';"
                        class="w-6 h-6 rounded-full object-cover border border-hairline-strong"
                    />
                {% else %}
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
                {% endif %}
                <span class="text-[11px] mt-1 font-medium">Profile</span>
            </button>
        </div>
        </div>

    </div>
    {% block scripts %}
    {% endblock %}
    {% for message in messages %}
    <script>
        Toastify({
            text: "{{ message }}",
            duration: 5000,
            close: true,
            gravity: "top",
            position: "right",
            backgroundColor: "{% if message.tags == 'error' %}#FF4C4C{% else %}#000000{% endif %}",
            stopOnFocus: true,
        }).showToast();
    </script>
    {% endfor %}

    {% comment %} <audio id="joke-audio" autoplay loop hidden></audio> {% endcomment %}
    <audio id="joke-audio" autoplay="true" hidden="true" loop="true"></audio>

</body>
</html>
