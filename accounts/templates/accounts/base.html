{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Login - No, Jay!{% endblock %}</title>
    <!-- Set the theme before first paint to avoid a light/dark flash -->
    <script>
        (function () {
            try {
                var t = localStorage.getItem('yd-theme');
                if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                if (t === 'dark') document.documentElement.classList.add('dark');
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
    <link rel="icon" type="image/x-icon" href="{% static 'images/fav.png' %}">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="{% static 'js/theme.js' %}" defer></script>
</head>
<body class="bg-canvas text-ink" data-user-name="{% if user.is_authenticated %}{{ user.username }}{% else %}None{% endif %}">
    <button data-theme-toggle aria-label="Toggle dark mode" class="tap-scale fixed top-4 right-4 z-50 w-10 h-10 rounded-full glass-pill flex items-center justify-center text-ink-muted hover:text-ink transition-colors">
        <i class="fas fa-sun text-sm hidden! dark:inline!"></i>
        <i class="fas fa-moon text-sm inline! dark:hidden!"></i>
    </button>
    <div class="min-h-screen flex items-center justify-center p-4">
        <!-- Login Container -->
        <div class="w-full max-w-md bg-surface rounded-2xl border border-hairline shadow-2xl p-8">
            {% block content %}{% endblock %}
        </div>
    </div>

    {% block scripts %}
    {% endblock %}

    {% for message in messages %}
    <script>
        Toastify({
            text: "{{ message }}",
            duration: 3000,
            close: true,
            gravity: "top",
            position: "right",
            backgroundColor: "{% if message.tags == 'error' %}#FF4C4C{% else %}#4BB543{% endif %}",
            stopOnFocus: true,
        }).showToast();
    </script>
    {% endfor %}

</body>
</html>
