{% extends 'accounts/base.html'%}
{% load static %}
{% block title %}Password Reset Complete{% endblock %}
{% block content%}
<div class="p-4 sm:p-4">
  <div class="text-center mb-4">
    <!-- Icon -->
    <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-surface-2 border border-hairline">
      <i class="fas fa-check-circle text-success text-xl"></i>
    </div>

    <!-- Title -->
    <h2 class="text-2xl font-bold text-ink mt-4">
      Password Reset Complete
    </h2>

    <!-- Messages -->
    <div class="mt-4 space-y-3 text-ink-muted text-sm">
      <p>Your password has been set successfully.</p>
      <p>
        You can now <a href="{% url 'login' %}" class="text-ink hover:text-accent-500 font-medium underline">sign in</a> with your new password.
      </p>
      <p>Thank you for using our service!</p>
    </div>
  </div>

  <!-- Login Button -->
  <div class="mt-6">
    <a href="{% url 'login' %}"
      class="w-full flex items-center justify-center px-4 py-3 rounded-xl text-sm font-bold text-accent-ink bg-accent-400 hover:bg-accent-500 transition-colors duration-200 tap-scale">
      <i class="fas fa-sign-in-alt mr-2"></i>
      Sign In Now
    </a>
  </div>
</div>
{% endblock %}
